name: mappa-base
# Carte di base e atlante del vento di tutte le case: gira solo quando cambiano o a mano. Circa 20-30 minuti (deposito pubblico: minuti gratuiti).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mappa/base.py", "mappa/geo.py", "mappa/vento.py", "mappa/solutore.py", ".github/workflows/mappa-base.yml"]
permissions:
  contents: write
jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CASA_LAT: ${{ secrets.CASA_LAT }}
      CASA_LON: ${{ secrets.CASA_LON }}
      CASA_QUOTA: ${{ secrets.CASA_QUOTA }}
      FIODOR_LAT: ${{ secrets.FIODOR_LAT }}
      FIODOR_LON: ${{ secrets.FIODOR_LON }}
      FIODOR_QUOTA: ${{ secrets.FIODOR_QUOTA }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet rasterio numpy pillow scipy pyamg
      - name: carte
        run: |
          for s in a b; do
            SITO=$s python3 mappa/base.py
          done
      - name: atlante del vento
        run: |
          for s in a b; do SITO=$s python3 mappa/vento.py; done
      - name: salva
        run: |
          git config user.name "pogoda"
          git config user.email "actions@users.noreply.github.com"
          git add mappa
          git diff --cached --quiet || git commit -m "Carta di base"
          git pull --rebase --quiet
          git push
