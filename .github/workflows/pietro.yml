name: pietro
# La carta del vento per Pietro, due volte al giorno: Lens sul rilievo per ECMWF e per ICON-2I (in parallelo), ognuno
# corretto sul mare con la sua libreria del radar (Lens 2), poi l'insieme 0,7 / 0,3. La pagina va nella release
# "pietro"; il lavoro "pogoda" la mette nel sito insieme alle altre. Deposito pubblico: minuti gratuiti.
on:
  schedule:
    - cron: "23 5,17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pietro/**", ".github/workflows/pietro.yml"]
permissions:
  contents: write
  actions: write
concurrency: pietro
jobs:
  lens:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {nome: ecmwf, modello: ecmwf_ifs025, libreria: lra1_ecmwf_palermo.lra}
          - {nome: icon, modello: italia_meteo_arpae_icon_2i, libreria: lra1_icon-2i_palermo.lra}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet numpy scipy pyamg rasterio pillow eccodes
      - name: libreria del radar
        run: |
          mkdir -p librerie
          curl -sSfL -o librerie/lib.lra https://github.com/giu-cloud/lens/releases/download/librerie-lra1/${{ matrix.libreria }} || echo "libreria non scaricata: si va senza"
      - name: calcolo
        env:
          LENS_PAGINA: "1"
          LENS_ORE: "36"
          LENS_MODELLO: ${{ matrix.modello }}
          LENS2_LIB: librerie/lib.lra
          LENS_SALVA: ${{ matrix.nome }}.json
        run: python3 pietro/lens/calcola.py
      - uses: actions/upload-artifact@v4
        with: {name: "${{ matrix.nome }}", path: "${{ matrix.nome }}.json", retention-days: 1}
  pagina:
    needs: lens
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet numpy
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {path: calcoli, merge-multiple: true}
      - run: python3 pietro/lens/unisci.py calcoli/ecmwf.json calcoli/icon.json
      - name: nella release e poi nel sito
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          cp pietro/lens/uscita/pagina.html pietro.html
          gh release view pietro >/dev/null 2>&1 || gh release create pietro --title "Pietro" --notes "Pagina del vento per Pietro, rifatta due volte al giorno."
          gh release upload pietro pietro.html --clobber
          gh api -X POST repos/${{ github.repository }}/actions/workflows/pogoda.yml/dispatches -f ref=main -f "inputs[forza]=0"
